name: Apply caught-up boundary review fixes

on:
  push:
    branches: ["feat/following-auto-liker-desktop"]
    paths:
      - ".github/workflows/apply-caught-up-boundary-fix.yml"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.5"
  RUFF_VERSION: "0.16.2"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/following-auto-liker-desktop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Apply review fixes and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path


          def read_lines(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()


          def write_lines(path: str, lines: list[str]) -> None:
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8")


          def find_line(lines: list[str], value: str, start: int = 0) -> int:
              try:
                  return lines.index(value, start)
              except ValueError as exc:
                  raise SystemExit(f"missing line marker: {value!r}") from exc


          browser_path = "apps/following_auto_liker/browser.py"
          browser = read_lines(browser_path)

          caught_start = find_line(browser, "CAUGHT_UP_PHRASES = (")
          caught_end = find_line(browser, "DISMISS_BUTTON_LABELS = (", caught_start)
          caught_block = '''CAUGHT_UP_PHRASES = (
              # English
              "you're all caught up",
              "you’re all caught up",
              # Korean
              "모두 확인했습니다",
              "새 게시물을 모두 확인했습니다",
              "최신 게시물을 모두 확인했습니다",
              # Japanese
              "すべてチェック済みです",
              "最新の投稿は以上です",
              "新しい投稿は以上です",
              "すべての新しい投稿をチェックしました",
              # Spanish
              "estás al día",
              "ya estás al día",
              "has visto todas las publicaciones nuevas",
              "ya viste todas las publicaciones nuevas",
              # French
              "vous êtes à jour",
              "vous avez tout vu",
              "vous avez vu toutes les nouvelles publications",
              # German
              "du bist auf dem neuesten stand",
              "du hast alles gesehen",
              "du hast alle neuen beiträge gesehen",
              # Portuguese
              "você está em dia",
              "você viu tudo",
              "você viu todas as publicações novas",
              # Russian
              "вы всё просмотрели",
              "вы все просмотрели",
              "вы просмотрели все новые публикации",
              # Simplified / Traditional Chinese
              "以上是最新动态",
              "以上是最新動態",
          )
          '''.splitlines()
          browser[caught_start:caught_end] = caught_block

          class_index = find_line(browser, "class ChromeBrowserSession:")
          boundary_script = r'''_CAUGHT_UP_BOUNDARY_SCRIPT = r"""
          (phrases) => {
            const normalize = value =>
              (value || "").replace(/\s+/g, " ").trim().toLocaleLowerCase();
            const wanted = phrases.map(normalize);
            const root = document.querySelector("main") || document.body;
            const isVisible = element => {
              const style = window.getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              return (
                style.display !== "none" &&
                style.visibility !== "hidden" &&
                style.opacity !== "0" &&
                rect.width > 0 &&
                rect.height > 0
              );
            };

            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            let marker = null;
            while (walker.nextNode()) {
              const textNode = walker.currentNode;
              const parent = textNode.parentElement;
              if (!parent || parent.closest("article") || !isVisible(parent)) continue;
              const text = normalize(textNode.nodeValue);
              if (text && wanted.some(phrase => text.includes(phrase))) {
                marker = parent;
                break;
              }
            }

            const articles = [...document.querySelectorAll("article")];
            if (!marker) return {found: false, boundary: articles.length};

            let boundary = articles.length;
            for (let index = 0; index < articles.length; index += 1) {
              const relation = marker.compareDocumentPosition(articles[index]);
              if (relation & Node.DOCUMENT_POSITION_FOLLOWING) {
                boundary = index;
                break;
              }
            }
            return {found: true, boundary};
          }
          """


          '''.splitlines()
          if "_CAUGHT_UP_BOUNDARY_SCRIPT = r\"\"\"" not in browser:
              browser[class_index:class_index] = boundary_script

          scroll_index = find_line(browser, "    def scroll_for_more(self) -> bool:")
          boundary_posts_method = '''    def posts_before_caught_up(self) -> tuple[list[PlaywrightFeedPost], bool]:
              """Return only posts above the first visible caught-up marker."""
              self._dismiss_common_dialogs()
              marker_found, boundary = self._caught_up_boundary()
              try:
                  articles = self.page.locator("article")
                  count = articles.count()
              except Exception as exc:
                  self.session.raise_browser_error(exc)

              limit = min(count, boundary) if marker_found else count
              posts = []
              for index in range(limit):
                  post = PlaywrightFeedPost(self.session, articles.nth(index))
                  if post.key:
                      posts.append(post)
              return posts, marker_found

          '''.splitlines()
          if "    def posts_before_caught_up(self) -> tuple[list[PlaywrightFeedPost], bool]:" not in browser:
              browser[scroll_index:scroll_index] = boundary_posts_method

          caught_method_start = find_line(browser, "    def is_caught_up(self) -> bool:")
          static_index = caught_method_start + 1
          while static_index < len(browser):
              if (
                  browser[static_index] == "    @staticmethod"
                  and static_index + 1 < len(browser)
                  and browser[static_index + 1].startswith("    def _is_following_url")
              ):
                  break
              static_index += 1
          if static_index >= len(browser):
              raise SystemExit("could not find _is_following_url boundary")
          caught_methods = '''    def is_caught_up(self) -> bool:
              """Match the localized feed marker outside articles."""
              found, _boundary = self._caught_up_boundary()
              return found

              def _caught_up_boundary(self) -> tuple[bool, int]:
                  try:
                      result = self.page.evaluate(
                          _CAUGHT_UP_BOUNDARY_SCRIPT,
                          list(CAUGHT_UP_PHRASES),
                      )
                  except Exception as exc:
                      self.session.raise_browser_error(exc)

                  if not isinstance(result, dict):
                      return False, 0
                  found = bool(result.get("found"))
                  try:
                      boundary = max(0, int(result.get("boundary", 0)))
                  except (TypeError, ValueError):
                      boundary = 0
                  return found, boundary

          '''.splitlines()
          # Correct the helper's class-level indentation after preserving readable YAML.
          caught_methods = [
              line[10:] if line.startswith("          def _caught_up_boundary") else line
              for line in caught_methods
          ]
          browser[caught_method_start:static_index] = caught_methods
          write_lines(browser_path, browser)

          engine_path = "apps/following_auto_liker/engine.py"
          engine = read_lines(engine_path)
          protocol_line = find_line(engine, "    def posts(self) -> Iterable[FeedPost]: ...")
          protocol_method = "    def posts_before_caught_up(self) -> tuple[Iterable[FeedPost], bool]: ..."
          if protocol_method not in engine:
              engine[protocol_line + 1:protocol_line + 1] = ["", protocol_method]

          loop_line = find_line(engine, "            for post in feed.posts():")
          engine[loop_line:loop_line + 1] = [
              "            batch_posts, caught_up_visible = feed.posts_before_caught_up()",
              "            for post in batch_posts:",
          ]
          caught_check = find_line(engine, "            if feed.is_caught_up():")
          engine[caught_check] = "            if caught_up_visible or feed.is_caught_up():"
          write_lines(engine_path, engine)

          tests_path = "tests/regression/test_following_auto_liker.py"
          tests = read_lines(tests_path)
          init_line = find_line(tests, "    def __init__(self, pages, *, caught_up_at=None):")
          tests[init_line] = "    def __init__(self, pages, *, caught_up_at=None, caught_up_boundaries=None):"
          assignment_line = find_line(tests, "        self.caught_up_at = caught_up_at", init_line)
          tests.insert(assignment_line + 1, "        self.caught_up_boundaries = caught_up_boundaries or {}")

          fake_scroll = find_line(tests, "    def scroll_for_more(self):")
          fake_boundary_method = '''    def posts_before_caught_up(self):
              posts = self.posts()
              boundary = self.caught_up_boundaries.get(self.index)
              if boundary is None:
                  return posts, self.is_caught_up()
              return posts[: max(0, int(boundary))], True

          '''.splitlines()
          if "    def posts_before_caught_up(self):" not in tests:
              tests[fake_scroll:fake_scroll] = fake_boundary_method

          restriction_test = find_line(
              tests,
              "    def test_restriction_after_like_stops_immediately_and_preserves_count(self):",
          )
          scanner_boundary_test = '''    def test_caught_up_boundary_skips_older_posts_loaded_in_same_page(self):
              recent = FakePost("/p/recent/")
              older = FakePost("/p/older/")
              feed = FakeFeed(
                  [[recent, older]],
                  caught_up_boundaries={0: 1},
              )

              summary = self.scanner().scan_once(feed)

              self.assertTrue(summary.caught_up)
              self.assertEqual(summary.discovered, 1)
              self.assertEqual(summary.liked, 1)
              self.assertEqual(recent.clicks, 1)
              self.assertEqual(older.clicks, 0)

          '''.splitlines()
          tests[restriction_test:restriction_test] = scanner_boundary_test

          main_guard = find_line(tests, 'if __name__ == "__main__":')
          dom_tests = '''    def test_caught_up_markers_are_recognized_in_every_supported_locale(self):
              feed = PlaywrightFollowingFeed(self.session)
              phrases = (
                  "You're all caught up",
                  "모두 확인했습니다",
                  "すべてチェック済みです",
                  "Estás al día",
                  "Vous êtes à jour",
                  "Du bist auf dem neuesten Stand",
                  "Você está em dia",
                  "Вы всё просмотрели",
                  "以上是最新动态",
                  "以上是最新動態",
              )
              for phrase in phrases:
                  with self.subTest(phrase=phrase):
                      self.page.set_content(f"<main><div id='caught-up'>{phrase}</div></main>")
                      self.assertTrue(feed.is_caught_up())

              def test_posts_before_caught_up_excludes_articles_below_marker(self):
                  self.page.set_content(
                      """
                      <main>
                        <article><a href="/p/recent/">recent</a></article>
                        <div id="caught-up">Estás al día</div>
                        <article><a href="/p/older/">older</a></article>
                      </main>
                      """
                  )
                  feed = PlaywrightFollowingFeed(self.session)

                  posts, caught_up = feed.posts_before_caught_up()

                  self.assertTrue(caught_up)
                  self.assertEqual([post.key for post in posts], ["/p/recent/"])


          '''.splitlines()
          # Correct the second method's class-level indentation.
          dom_tests = [
              line[10:] if line.startswith("          def test_posts_before_caught_up") else line
              for line in dom_tests
          ]
          tests[main_guard:main_guard] = dom_tests
          write_lines(tests_path, tests)
          PY

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "ruff==${RUFF_VERSION}"
          python -m pip install -r apps/following_auto_liker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Format and verify
        run: |
          ruff check --fix apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format --check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          python -m compileall -q apps tests/regression/test_following_auto_liker.py
          python -m unittest -v tests.regression.test_following_auto_liker
          git diff --check

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/following_auto_liker/browser.py apps/following_auto_liker/engine.py tests/regression/test_following_auto_liker.py
          git commit -m "fix: stop at localized caught-up boundary"
          git push origin HEAD:feat/following-auto-liker-desktop
