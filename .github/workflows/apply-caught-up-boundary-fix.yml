name: Apply caught-up boundary review fixes

on:
  pull_request:
    paths:
      - ".github/workflows/apply-caught-up-boundary-fix.yml"
      - ".github/scripts/apply_caught_up_fix.py"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.5"
  RUFF_VERSION: "0.16.2"

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/following-auto-liker-desktop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Apply review fixes
        run: python .github/scripts/apply_caught_up_fix.py

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "ruff==${RUFF_VERSION}"
          python -m pip install -r apps/following_auto_liker/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Format and verify
        run: |
          ruff check --fix apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format --check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          python -m compileall -q apps tests/regression/test_following_auto_liker.py
          python -m unittest -v tests.regression.test_following_auto_liker
          git diff --check

      - name: Commit source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/following_auto_liker/browser.py apps/following_auto_liker/engine.py tests/regression/test_following_auto_liker.py
          git commit -m "fix: stop at localized caught-up boundary"
          git push origin HEAD:feat/following-auto-liker-desktop
