name: Finalize and Verify Following Auto Liker

on:
  push:
    branches: ["feat/following-auto-liker-desktop"]
    paths:
      - ".github/workflows/finalize-following-auto-liker-v2.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/following-auto-liker-desktop
          fetch-depth: 0

      - name: Let any earlier formatter finish, then use the latest branch
        shell: bash
        run: |
          sleep 20
          git fetch origin feat/following-auto-liker-desktop
          git reset --hard origin/feat/following-auto-liker-desktop

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"

      - name: Install repository Ruff version
        run: python -m pip install ruff==0.16.2

      - name: Restore constants and remove temporary files
        shell: bash
        run: |
          cat > apps/following_auto_liker/browser_constants.py <<'PY'
          from __future__ import annotations

          INSTAGRAM_HOME_URL = "https://www.instagram.com/"
          INSTAGRAM_FOLLOWING_URL = "https://www.instagram.com/?variant=following"

          ARTICLE_SELECTORS = (
              'article:has(a[href*="/p/"])',
              'article:has(a[href*="/reel/"])',
              'article:has(a[href*="/tv/"])',
          )

          LIKE_LABELS = ("Like", "좋아요")
          UNLIKE_LABELS = ("Unlike", "좋아요 취소")
          SPONSORED_LABELS = ("Sponsored", "광고")
          RECOMMENDATION_LABELS = (
              "Suggested for you",
              "Because you follow",
              "Recommended for you",
              "회원님을 위한 추천",
              "추천 게시물",
          )
          CAUGHT_UP_LABELS = (
              "You're all caught up",
              "모두 확인했습니다",
              "새 게시물을 모두 확인했습니다",
          )
          RESTRICTION_PHRASES = (
              "try again later",
              "we restrict certain activity",
              "action blocked",
              "please wait a few minutes",
              "잠시 후 다시 시도",
              "일부 활동을 제한",
              "활동을 제한",
              "작업이 차단",
              "몇 분 후 다시 시도",
          )
          RESERVED_PATHS = {
              "accounts",
              "about",
              "api",
              "challenge",
              "developer",
              "direct",
              "directory",
              "emails",
              "explore",
              "legal",
              "oauth",
              "p",
              "privacy",
              "push",
              "reel",
              "reels",
              "session",
              "stories",
              "terms",
              "tv",
              "web",
          }
          _UNSET = object()
          PY
          rm -f this-path-should-not-exist.tmp
          rm -f .github/workflows/finalize-following-auto-liker.yml
          rm -f .github/workflows/finalize-following-auto-liker-v2.yml

      - name: Apply and verify Ruff formatting
        run: |
          ruff check --fix apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format --check apps/following_auto_liker tests/regression/test_following_auto_liker.py

      - name: Run regression tests
        run: |
          python -m compileall -q apps tests/regression/test_following_auto_liker.py
          python -m unittest -v tests.regression.test_following_auto_liker

      - name: Commit finalized source
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff formatting"
            git push origin HEAD:feat/following-auto-liker-desktop
          fi
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalized commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . ruff==0.16.2
      - name: Verify final source
        run: |
          ruff check --output-format=github .
          ruff format --check .
          python -m compileall -q apps tests/regression/test_following_auto_liker.py
          python -m unittest -v tests.regression.test_following_auto_liker

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: FollowingAutoLiker-Windows
          - os: macos-15
            artifact_name: FollowingAutoLiker-macOS-Apple-Silicon
          - os: macos-15-intel
            artifact_name: FollowingAutoLiker-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out finalized commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . playwright==1.62.0 pyinstaller
      - name: Build desktop application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name FollowingAutoLiker --paths . --collect-all instagrapi
          --collect-all playwright apps/following_auto_liker/app.py
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FollowingAutoLiker.exe -DestinationPath "${{ matrix.artifact_name }}.zip"
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/FollowingAutoLiker.app "${{ matrix.artifact_name }}.zip"
      - name: Upload packaged application
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error
