name: Temporary Ruff Autofix

on:
  push:
    branches: ["feat/following-auto-liker-desktop"]
    paths:
      - ".github/workflows/temporary-ruff-autofix.yml"
      - "apps/following_auto_liker/**"
      - "tests/regression/test_following_auto_liker.py"

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.2

      - name: Add the type-only feed import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/following_auto_liker/browser_session.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("from typing import Any\n", "from typing import TYPE_CHECKING, Any\n")
          marker = "from .engine_shared import (\n    BrowserClosedError,\n    ChromeLaunchError,\n    PlaywrightMissingError,\n)\n\n"
          replacement = marker + "if TYPE_CHECKING:\n    from .browser_following import PlaywrightFollowingFeed\n\n\n"
          if "if TYPE_CHECKING:\n    from .browser_following import PlaywrightFollowingFeed" not in text:
              if marker not in text:
                  raise SystemExit("browser_session import marker not found")
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply Ruff fixes and formatting
        run: |
          ruff check --fix apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format apps/following_auto_liker tests/regression/test_following_auto_liker.py

      - name: Verify source
        run: |
          ruff check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format --check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          python -m compileall -q apps tests/regression/test_following_auto_liker.py
          python -m unittest -v tests.regression.test_following_auto_liker

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/following_auto_liker tests/regression/test_following_auto_liker.py
          if git diff --cached --quiet; then
            echo "No Ruff changes were needed."
            exit 0
          fi
          git commit -m "style: apply Ruff formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
