name: Apply PR 9 Remaining Fixes

on:
  push:
    branches:
      - fix/unified-instagram-tools
    paths:
      - .github/workflows/apply-pr9-remaining-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out review branch
        uses: actions/checkout@v7
        with:
          ref: fix/unified-instagram-tools

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.13.5

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . ruff==0.16.2
          python -m pip install -r apps/following_auto_liker/requirements.txt
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi

      - name: Apply review corrections
        run: python .github/scripts/apply_pr9_remaining_fixes.py

      - name: Format and lint
        run: |
          ruff format \
            apps/instagram_tools/browser.py \
            apps/instagram_tools/worker.py \
            tests/regression/test_instagram_tools.py
          ruff check \
            apps/instagram_tools \
            apps/following_auto_liker \
            apps/non_follower_cleaner \
            tests/regression/test_instagram_tools.py \
            tests/regression/instagram_tools_layout_smoke.py \
            tests/regression/test_following_auto_liker.py \
            tests/regression/test_non_follower_cleaner*.py

      - name: Run desktop regression suite
        run: >-
          python -m unittest -v
          tests.regression.test_instagram_tools
          tests.regression.test_following_auto_liker
          tests.regression.test_non_follower_cleaner
          tests.regression.test_non_follower_cleaner_http_success

      - name: Verify compact laptop layout
        run: >-
          xvfb-run -a -s "-screen 0 1366x768x24"
          python -m tests.regression.instagram_tools_layout_smoke

      - name: Verify retired release instructions are gone
        run: |
          ! grep -R "following-auto-liker-v\|non-follower-cleaner-v\|workflows/following-auto-liker.yml\|workflows/non-follower-cleaner.yml" \
            apps/following_auto_liker/README.md \
            apps/non_follower_cleaner/README.md
          grep -q "instagram-tools-v\*" apps/following_auto_liker/README.md
          grep -q "instagram-tools-v\*" apps/non_follower_cleaner/README.md

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/instagram_tools/browser.py \
            apps/instagram_tools/worker.py \
            apps/following_auto_liker/README.md \
            apps/non_follower_cleaner/README.md \
            tests/regression/test_instagram_tools.py
          git diff --cached --check
          git diff --cached --quiet && {
            echo "Patch produced no changes" >&2
            exit 1
          }
          git commit -m "fix: address remaining unified-tool review findings"
          git push origin HEAD:fix/unified-instagram-tools
