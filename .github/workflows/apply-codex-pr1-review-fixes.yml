name: Apply Codex PR1 Review Fixes

on:
  push:
    branches: ["feat/following-auto-liker-desktop"]
    paths:
      - ".github/workflows/apply-codex-pr1-review-fixes.yml"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13.5"
  RUFF_VERSION: "0.16.2"

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/following-auto-liker-desktop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Reconstruct and apply reviewed fixes
        shell: bash
        run: |
          set -euo pipefail
          cat .codex-pr1-fix/part* | base64 --decode > /tmp/codex-pr1-fixes.tar.xz
          echo "fdafe75dc1c5a6984ae1b6506aef27f46d9d6e2c6c6ec9b55bbeb74651cb6274  /tmp/codex-pr1-fixes.tar.xz" | sha256sum -c -
          tar -xJf /tmp/codex-pr1-fixes.tar.xz -C .
          rm -rf .codex-pr1-fix
          find apps tests -type d -name __pycache__ -prune -exec rm -rf {} +
          find apps tests -type f -name '*.pyc' -delete

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . "ruff==${RUFF_VERSION}"
          python -m pip install -r apps/following_auto_liker/requirements.txt

      - name: Format and verify
        run: |
          ruff check --fix apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format --check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          python -m compileall -q apps tests/regression/test_following_auto_liker.py
          python - <<'PY'
          from apps.following_auto_liker import AppAlreadyRunningError
          from apps.following_auto_liker.browser import PlaywrightFollowingFeed

          assert AppAlreadyRunningError
          assert PlaywrightFollowingFeed
          PY
          python -m unittest -v tests.regression.test_following_auto_liker
          git diff --check

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: address final Codex auto-liker review"
          git push origin HEAD:feat/following-auto-liker-desktop
