name: Following Auto Liker

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - "apps/following_auto_liker/**"
      - "tests/regression/test_following_auto_liker.py"
      - ".github/workflows/following-auto-liker.yml"
  push:
    branches: ["master"]
    tags: ["following-auto-liker-v*"]
    paths:
      - "apps/following_auto_liker/**"
      - "tests/regression/test_following_auto_liker.py"
      - ".github/workflows/following-auto-liker.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
      - name: Run regression tests
        run: python -m unittest -v tests.regression.test_following_auto_liker

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: FollowingAutoLiker-Windows
          - os: macos-15
            artifact_name: FollowingAutoLiker-macOS-Apple-Silicon
          - os: macos-15-intel
            artifact_name: FollowingAutoLiker-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          python -m pip install -r apps/following_auto_liker/requirements.txt
      - name: Build desktop application
        run: >-
          pyinstaller --noconfirm --clean --onefile --windowed
          --name FollowingAutoLiker --paths . --collect-all playwright
          apps/following_auto_liker/app.py
      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/FollowingAutoLiker.exe -DestinationPath "${{ matrix.artifact_name }}.zip"
      - name: Package macOS application
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/FollowingAutoLiker.app "${{ matrix.artifact_name }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/following-auto-liker-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-artifacts
      - name: Collect release files
        run: |
          mkdir release-files
          find release-artifacts -type f -name '*.zip' -exec cp '{}' release-files/ \;
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release-files/*.zip
          --repo "${GITHUB_REPOSITORY}" --generate-notes
          --title "Following Auto Liker ${GITHUB_REF_NAME}"
