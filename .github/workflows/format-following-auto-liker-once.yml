name: Format Following Auto Liker Once

on:
  pull_request:
    branches: ["master"]
    paths:
      - ".github/workflows/format-following-auto-liker-once.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/following-auto-liker-desktop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/following-auto-liker-desktop
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
      - name: Install tools and package
        run: |
          python -m pip install ruff==0.16.2
          python -m pip install .
      - name: Format and verify
        run: |
          ruff format apps/following_auto_liker/app.py apps/following_auto_liker/browser.py tests/regression/test_following_auto_liker.py
          ruff check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          python -m compileall -q apps tests/regression/test_following_auto_liker.py
          python -m unittest -v tests.regression.test_following_auto_liker
      - name: Remove this one-time workflow and commit
        run: |
          rm .github/workflows/format-following-auto-liker-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff formatting"
          git push origin HEAD:feat/following-auto-liker-desktop
