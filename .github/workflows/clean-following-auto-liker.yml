name: Apply Clean Following Auto Liker

on:
  pull_request:
    branches: ["master"]
    paths:
      - ".cleanup-parts/**"
      - ".github/workflows/clean-following-auto-liker.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feat/following-auto-liker-desktop'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v7
        with:
          ref: feat/following-auto-liker-desktop
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"

      - name: Install Ruff
        run: python -m pip install ruff==0.16.2

      - name: Restore clean implementation
        shell: bash
        run: |
          cat .cleanup-parts/part-* | base64 --decode > /tmp/following-auto-liker.tar.xz
          tar -xJf /tmp/following-auto-liker.tar.xz -C .

          rm -rf .cleanup-parts
          rm -f this-path-should-not-exist.tmp
          rm -f .github/workflows/finalize-following-auto-liker.yml
          rm -f .github/workflows/finalize-following-auto-liker-v2.yml
          rm -f .github/workflows/clean-following-auto-liker.yml

          rm -f apps/following_auto_liker/browser.py
          rm -f apps/following_auto_liker/browser_common.py
          rm -f apps/following_auto_liker/browser_constants.py
          rm -f apps/following_auto_liker/browser_following.py
          rm -f apps/following_auto_liker/browser_post.py
          rm -f apps/following_auto_liker/browser_session.py
          rm -f apps/following_auto_liker/engine.py
          rm -f apps/following_auto_liker/engine_runner.py
          rm -f apps/following_auto_liker/engine_scanner.py
          rm -f apps/following_auto_liker/engine_shared.py
          rm -f apps/following_auto_liker/storage.py
          rm -f apps/following_auto_liker/view.py

      - name: Format and lint
        run: |
          ruff check --fix apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff check apps/following_auto_liker tests/regression/test_following_auto_liker.py
          ruff format --check apps/following_auto_liker tests/regression/test_following_auto_liker.py

      - name: Run regression tests
        run: |
          python -m compileall -q apps tests/regression/test_following_auto_liker.py
          python -m unittest -v tests.regression.test_following_auto_liker
          python - <<'PY'
          from apps.following_auto_liker import AppConfig, FollowingAutoLiker, Storage

          assert AppConfig().validate().min_delay_seconds == 3
          assert FollowingAutoLiker
          assert Storage
          PY

      - name: Ensure temporary artifacts are gone
        shell: bash
        run: |
          test ! -e .cleanup-parts
          test ! -e this-path-should-not-exist.tmp
          test ! -e .github/workflows/finalize-following-auto-liker.yml
          test ! -e .github/workflows/finalize-following-auto-liker-v2.yml
          test ! -e .github/workflows/clean-following-auto-liker.yml

      - name: Commit clean implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: consolidate and harden Chrome auto-liker"
          git push origin HEAD:feat/following-auto-liker-desktop
