name: Format Instagram Tools Branch

on:
  push:
    branches: ["fix/unified-instagram-tools"]
    paths:
      - "apps/instagram_tools/**"
      - "tests/regression/test_instagram_tools.py"
      - ".github/workflows/format-instagram-tools-branch.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/unified-instagram-tools
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.5"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.2"
      - name: Apply Ruff fixes and formatting
        run: |
          ruff check --fix apps/instagram_tools tests/regression/test_instagram_tools.py
          ruff format apps/instagram_tools tests/regression/test_instagram_tools.py
      - name: Commit formatted files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/instagram_tools tests/regression/test_instagram_tools.py
          git commit -m "style: format unified Instagram tools"
          git push origin HEAD:fix/unified-instagram-tools
